interface:
  display_name: "Game Logic Analysis"
  short_description: "按实现边界路由分析离线单机游戏逻辑，并保留可复现证据"
  default_prompt: "使用 $analyze-game-logic 分析这个已授权的离线单机游戏目标逻辑。先用玩家可观察的行为和复现步骤定义研究问题，再判断实现边界并只加载匹配的 adapter；当问题涉及 gameplay mechanic/行为因果时，再用 gameplay semantic model 按相关的 trigger、eligibility、inputs、computation/RNG、authoritative state mutation、secondary effects/presentation、persistence/reset/lifetime 重建机制，纯定位/身份问题只解析与问题直接相关的语义阶段。如果源码直接可读，优先按源码依赖关系批量定位语义锚点；如果是打包、压缩或混淆的 Web/JavaScript 产物，按 Web/JS adapter 先取得完成目标所需的最小可读视图，再追 simulation/state owner 与机制路径；对关键结论保留版本、哈希、源码定位或（编译/原生边界时）module+RVA、证据与必要的独立验证。优先只读静态分析，只有在我的请求范围明确包含运行时操作时才启动、附加或修改进程。"
