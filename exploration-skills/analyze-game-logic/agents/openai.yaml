interface:
  display_name: "Game Logic Analysis"
  short_description: "Trace authorized offline game mechanics with reproducible evidence"
  default_prompt: "Use $analyze-game-logic on this authorized offline/local target. Define the concrete question and analysis depth, map only the implementation layers material to it, and load supporting references only when their branch fires. For gameplay behavior or causality, reconstruct the smallest material mechanic slice and close it with version-scoped semantic evidence. Name the material unknown before escalating to a more opaque layer. Keep identity/location questions narrow, default to read-only static analysis, and require explicit scope before runtime actions or destructive modification."
