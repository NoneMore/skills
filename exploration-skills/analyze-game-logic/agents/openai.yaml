interface:
  display_name: "Game Logic Analysis"
  short_description: "Trace offline game mechanics across implementation layers with reproducible evidence"
  default_prompt: "Use $analyze-game-logic on this authorized offline/local target. Define the question, map the implementation layers material to it, and load only adapters needed for the unresolved path. For gameplay behavior or causality, reconstruct the smallest material mechanic slice with the canonical gameplay semantic model. Characterize relevant readable/configuration layers before escalating into a more opaque or expensive boundary, and name the semantic unknown plus the positive transition evidence or bounded-search rationale that makes the heavier layer the next material place to investigate. Choose the least-cost tooling path for that unknown: use bounded one-shot queries for narrow questions, but prefer existing persistent structured tooling or reusable helpers over repeated ad-hoc wrappers for iterative work. Keep identity/location questions narrow, and default to read-only static analysis unless the requested scope explicitly includes runtime actions."
