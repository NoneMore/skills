interface:
  display_name: "Game Logic Analysis"
  short_description: "Trace offline game mechanics across implementation layers with reproducible evidence"
  default_prompt: "Use $analyze-game-logic on this authorized offline/local target. Define the question, map only the implementation layers material to it, and load adapters only for the unresolved path. For gameplay behavior or causality, reconstruct the smallest material mechanic slice with the canonical gameplay semantic model. Before escalating to a more opaque or expensive layer, name the semantic unknown and the evidence or bounded-search rationale that makes that layer the next material place to investigate. Use the least-cost evidence-preserving tooling path, keep identity/location questions narrow, and default to read-only static analysis unless runtime actions are explicitly in scope."
