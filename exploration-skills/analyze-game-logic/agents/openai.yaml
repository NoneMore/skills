interface:
  display_name: "Game Logic Analysis"
  short_description: "Route offline game analysis by implementation boundary with reproducible evidence"
  default_prompt: "Use $analyze-game-logic on this authorized offline/local target. Define the question, detect the implementation boundary, load only the matching adapter, and follow the core evidence/validation protocol. For gameplay behavior or causality, reconstruct the smallest material mechanic slice with the canonical gameplay semantic model; keep identity/location questions narrow. Default to read-only static analysis unless the requested scope explicitly includes runtime actions."
