interface:
  display_name: "Game Logic Analysis"
  short_description: "Route offline game analysis by implementation boundary with reproducible evidence"
  default_prompt: "Use $analyze-game-logic to analyze this authorized offline/local game logic target. Define the research question, detect the implementation boundary, and load only the matching adapter. For gameplay behavior or causality questions, reconstruct the mechanic with the canonical gameplay semantic model and trace it to the authoritative state change; keep pure identity/location questions narrow. Prefer source dependency analysis when readable source is available, and recover only the minimum readable view needed for Web/JavaScript builds. Preserve version/hash provenance, stable implementation locators, and independent evidence for material claims. Default to read-only static analysis; launch, attach to, instrument, or modify a process only when the requested scope explicitly includes runtime actions."
