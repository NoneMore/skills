name: Game Logic Project Store

on:
  pull_request:
    paths:
      - "game-logic-skills/**"
      - ".github/workflows/game-logic-project-store.yml"
  push:
    branches: [main]
    paths:
      - "game-logic-skills/**"
      - ".github/workflows/game-logic-project-store.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify project store and bootstrap
        run: |
          python game-logic-skills/bootstrap-game-logic-project/scripts/project_store.py --self-test
          python game-logic-skills/bootstrap-game-logic-project/scripts/bootstrap.py --self-test
