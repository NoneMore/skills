name: Bug report
description: Report behavior that appears incorrect or broken.
title: ""
labels:
  - "tracker:kind:intake"
  - "tracker:status:needs-triage"
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you observed and what you expected instead.
      placeholder: Tell us what went wrong and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest useful sequence of steps, inputs, or example.
      placeholder: Steps, commands, input, or a minimal example.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions, platform, configuration, or other context when relevant.
      placeholder: Version, OS, runtime, browser, configuration, and so on.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, traces, links, or other evidence when available.
      placeholder: Paste or attach anything that helps preserve what you observed.
    validations:
      required: false
